<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Друга гра · Brukivka</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
      background:radial-gradient(ellipse at 76% 5%,#3d327e 0,transparent 48%),linear-gradient(145deg,#131d37,#090c17);
      color:#f0f3ff; }
    main { width:min(100%,530px); border:1px solid #ffffff20; background:#0f192de8;
      box-shadow:0 28px 90px #0006; border-radius:24px; padding:clamp(28px,7vw,55px); text-align:center; }
    .icon { width:90px; height:90px; display:grid; place-items:center; margin:0 auto 21px;
      border-radius:20px; background:linear-gradient(140deg,#7467e8,#32418c); font-size:45px; }
    small { color:#a3b5ed; font-weight:900; letter-spacing:.22em; font-size:11px; }
    h1 { font-size:clamp(27px,6vw,39px); margin:10px 0; }
    p { color:#aebad3; line-height:1.65; }
    a { display:inline-flex; align-items:center; gap:9px; padding:13px 23px; margin-top:16px;
      background:linear-gradient(120deg,#5f7beb,#8f65ef); color:#fff; text-decoration:none;
      font-weight:800; border-radius:12px; }
    a:hover { filter:brightness(1.12); }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🎮</div>
    <small>BRUKIVKA · НОВА ГРА</small>
    <h1>Скоро тут буде гра</h1>
    <p>Перехід між іграми вже працює. Коли нова гра буде готова, заміни цей файл <strong>game2.html</strong> на її код.</p>
    <a href="index.html">← Назад до Brukivka</a>
  </main>
</body>
</html>
